    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #030308;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Звёздный фон на чистом CSS */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #030308 radial-gradient(circle at 20% 30%, rgba(120, 20, 180, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(20, 100, 200, 0.12), transparent 45%),
                        radial-gradient(circle at 50% 50%, rgba(200, 30, 60, 0.08), transparent 35%);
            z-index: 0;
            pointer-events: none;
        }

        .stars-bg::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 160px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 230px 190px, rgba(255,255,255,0.85), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 310px 80px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            opacity: 0.6;
            animation: starsTwinkle 4s ease-in-out infinite alternate;
        }

        @keyframes starsTwinkle {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        /* Контейнер элементов */
        .universe {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            z-index: 2;
            padding: 30px;
        }

        .brand-logo {
            position: absolute;
            top: 30px;
            left: 35px;
            font-family: 'Cinzel', serif;
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
            z-index: 10;
        }

        /* Плавающие тексты */
        .floating-item {
            position: absolute;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            transition: transform 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
            white-space: nowrap;
            line-height: 1.2;
            display: inline-block;
            cursor: pointer;
        }

        .floating-item:hover {
            color: #ffffff;
            z-index: 100 !important;
            transform: translateY(-3px) scale(1.02);
        }

        /* Стили шрифтов */
        .type-greeting {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(1.8rem, 4vw, 4rem);

            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        .type-greeting:hover {
            text-shadow: 0 0 35px rgba(0, 240, 255, 0.9);
            color: #66f5ff;
        }

        .type-main-title {

            text-shadow: 0 0 25px rgba(255, 51, 102, 0.6);
            white-space: normal;
            max-width: 850px;
        }

        .type-main-title:hover {
            text-shadow: 0 0 40px rgba(255, 51, 102, 0.9);
            color: #ff6688;
        }

        .type-huge {
            font-family: 'Cinzel', serif;

            font-size: clamp(1.6rem, 4vw, 4rem);

            text-shadow: 0 0 30px rgba(255, 50, 50, 0.9), 0 0 60px rgba(255, 0, 0, 0.5);
